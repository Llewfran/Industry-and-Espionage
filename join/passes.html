<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Pass QR codes · test sheet · Industry &amp; Espionage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel:wght@700&family=Crimson+Text:ital@0;1&display=swap">
<style>
@page{size:A4;margin:10mm}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#3a2210;font:16px/1.4 "Crimson Text",Georgia,serif;color:#2a1606}
.bar{max-width:190mm;margin:18px auto 10px;color:#f3e3bd;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar h1{font:700 20px "Cinzel",serif;letter-spacing:.05em;color:#f2d48a}
.bar p{font-style:italic;max-width:34em}
.bar button{font:700 16px "Cinzel",serif;padding:10px 22px;border-radius:10px;border:2px solid #3b210b;background:linear-gradient(#f6dc96,#c99a45 45%,#8d5e1f);color:#2a1606;cursor:pointer}
.sheet{width:190mm;margin:0 auto 30px;background:#fff;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:55mm;gap:0}
.pass{border:.3mm dashed #b9a27a;display:flex;align-items:center;gap:5mm;padding:4mm 6mm;background:#f6ecd4}
.pass .qr{width:45mm;height:45mm;flex:none;background:#fff;padding:1.5mm}
.pass .qr svg{display:block;width:100%;height:100%}
.pass .txt{display:flex;flex-direction:column;align-items:flex-start;gap:1mm}
.pass .k{font:700 3.2mm "Cinzel",serif;letter-spacing:.3em;text-transform:uppercase;color:#8d5e1f}
.pass .n{font:900 16mm/1 "Cinzel Decorative",serif;color:#2a1606}
.pass .s{font:italic 3.6mm/1.25 "Crimson Text",serif;color:#5a3a14;max-width:34mm}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0}}
</style>
</head>
<body>
<div class="bar">
  <div><h1>Order Pass QR codes · test sheet</h1>
  <p>Print, cut along the dashes and stick each code on the back of its Order Pass. Scan the Port clock on the iPad first, then a Pass.</p></div>
  <button onclick="print()">Print</button>
</div>
<div class="sheet" id="sheet"></div>
<script src="../shared/link.js"></script>
<script>
// Codes point at the live site unless this sheet is opened on the live site or on this computer for testing
const here = /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
const base = (here ? new URL('./', location.href).href.split('?')[0] : 'https://llewfran.github.io/Industry-and-Espionage/join/') + (/[?&]relay=local\b/.test(location.search) ? '?relay=local' : '');
document.getElementById('sheet').innerHTML = Array.from({length:10}, (_, i) => `
  <div class="pass"><div class="qr">${IE.QR.svg(base + '#p=' + (i+1), { margin: 0, dark: '#1a0e04' })}</div>
  <div class="txt"><span class="k">Order Pass</span><span class="n">${i+1}</span><span class="s">Scan with your phone’s camera after the Port clock.</span></div></div>`).join('');
</script>
</body>
</html>
